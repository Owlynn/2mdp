<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sampler à répliques des deux minutes du peuple</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="normalize.css">
    <link rel="stylesheet" href="skeleton.css">
    <link rel="stylesheet" href="style.css">
    <!-- HANDLEBARS INSTALL -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.6/handlebars.min.js" integrity="sha512-zT3zHcFYbQwjHdKjCu6OMmETx8fJA9S7E6W7kBeFxultf75OPTYUJigEKX58qgyQMi1m1EgenfjMXlRZG8BXaw==" crossorigin="anonymous"></script>
    
    <!-- HANDLEBARS TEMPLATE -->
    <script id="hb" type="text/x-handlebars-template">
        {{#each samples}}
            <audio id = "son{{@index}}-player" src="samples/{{this}}.mp3"></audio>
            <div class = "boutons button" id="son{{@index}}"> {{this}} </div>
        {{/each}}
    </script>

    <script async src="samples.js"></script>
    <script async src="script.js"></script>
    
</head>
<body>
        <div class="row">
            
            <div id="deuxmin" class="four columns">
                <h1>Les deux minutes du peuple</h1>
                <p>Cliquez sur un bouton pour lancer le sample !</p>
            </div>
        
            <div class="eight columns" id="blocs"></div>

        </div>        

</body>
</html>
